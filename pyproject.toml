[project]
name = "expense-tracker-mcp"
version = "0.1.0"
description = "track your daily expenses"
readme = "README.md"
authors = [
    { name = "N Ali-lap", email = "thisisnauman.ali" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastmcp>=4.1.6",
]

[project.scripts]
expense-tracker-mcp = "expense_tracker_mcp:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
